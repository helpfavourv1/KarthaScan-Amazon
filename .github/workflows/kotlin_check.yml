name: Kotlin Compile Check

on:
  workflow_dispatch:

jobs:
  kotlin-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get dependencies
        working-directory: app
        run: flutter pub get

      - name: Compile Kotlin only
        working-directory: app/android
        run: ./gradlew :app:compileReleaseKotlin --no-daemon --stacktrace
