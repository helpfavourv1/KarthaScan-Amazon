name: Kotlin Compile Check

on:
  workflow_dispatch:

jobs:
  kotlin-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get dependencies
        working-directory: app
        run: flutter pub get

      - name: Compile Kotlin (debug APK, arm64 only)
        working-directory: app
        run: flutter build apk --debug --target-platform android-arm64
